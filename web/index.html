<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sub-UI · S-UI 订阅聚合与分流控制面板</title>
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var mode = localStorage.getItem('subui-theme-mode') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) root.classList.add('dark')
          var preset = localStorage.getItem('subui-theme-preset') || 'default'
          var font = localStorage.getItem('subui-theme-font') || 'default'
          var radius = localStorage.getItem('subui-theme-radius') || 'default'
          var scale = localStorage.getItem('subui-theme-scale') || 'default'
          var resolvedFont = font === 'default' ? (preset === 'anthropic' ? 'serif' : 'system') : font
          if (preset && preset !== 'default') root.setAttribute('data-theme-preset', preset)
          root.setAttribute('data-theme-font', resolvedFont)
          if (radius && radius !== 'default') root.setAttribute('data-theme-radius', radius)
          if (scale && scale !== 'default') root.setAttribute('data-theme-scale', scale)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
