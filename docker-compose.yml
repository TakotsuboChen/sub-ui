services:
  sub-ui:
    image: ghcr.io/takotsubochen/sub-ui:latest
    container_name: sub-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Asia/Shanghai
      - GOMEMLIMIT=160MiB
